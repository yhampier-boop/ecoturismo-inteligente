<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Imagen de referencia de paisaje</title>
  <desc id="desc">Ilustración abstracta de montañas, sol y camino con los colores del sitio.</desc>
  <defs>
